{{- if .Values.serviceMonitor.enabled }}
# Tells the Prometheus Operator (kube-prometheus-stack, Phase 7) to scrape /metrics on every
# pod behind the Service. The job label in Prometheus becomes the Service name.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "orbit-telemetry.fullname" . }}
  labels:
    {{- include "orbit-telemetry.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "orbit-telemetry.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
