{{- if .Values.serviceAccount.create }}
# Its own identity with no API access. The token is not mounted: the app never calls the
# Kubernetes API, so a compromised pod has no credentials to use.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orbit-telemetry.serviceAccountName" . }}
  labels:
    {{- include "orbit-telemetry.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
