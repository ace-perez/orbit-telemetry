# Grafana Alloy 1.16.0 chart (Promtail's successor): one pod per node that reads every
# container's logs through the Kubernetes API and pushes them to Loki with useful labels.
controller:
  type: daemonset

alloy:
  configMap:
    create: true
    content: |
      // Find every pod on the cluster.
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Turn Kubernetes metadata into the labels used to query logs in Grafana.
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      // Tail container logs through the API server (no host log files needed).
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }

  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      memory: 256Mi
