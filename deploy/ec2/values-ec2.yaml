# Values for production: k3s on the Graviton EC2 node.
# The release script adds the rest at deploy time: image.tag (sha-<commit>) and ingress.host
# (orbit.<elastic ip>.nip.io), so nothing environment-specific is hardcoded here.

config:
  environment: production
  celestrakBaseUrl: https://celestrak.org # the real CelesTrak, refreshed every 2 hours (fair use)
  failureRate: 0 # the rollback demo raises this in a pull request, then reverts it

ingress:
  enabled: true
  className: traefik # bundled with k3s, listening on ports 80 and 443 of the node

# Phase 7: scraped by kube-prometheus-stack, alert rules and SLO, dashboards, synthetic traffic.
serviceMonitor:
  enabled: true
prometheusRule:
  enabled: true
grafanaDashboards:
  enabled: true
trafficGenerator:
  enabled: true
