# SonarQube Cloud settings. Check both keys on the project's Information page
# in SonarQube Cloud and correct them here if they differ.
sonar.organization=ace-perez
sonar.projectKey=ace-perez_orbit-telemetry
sonar.projectName=Orbit Telemetry

# What to analyse
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.13
# Vendored third-party browser files: pinned and checksum-tested, not our code to analyse.
sonar.exclusions=src/orbit_telemetry/static/vendor/**
# Browser code has no unit-test coverage report; it is checked by the page tests and a manual
# browser run, so leave it out of the coverage measure instead of counting it as uncovered.
sonar.coverage.exclusions=src/orbit_telemetry/static/**

# Coverage produced by the test job (pytest --cov-report=xml)
sonar.python.coverage.reportPaths=coverage.xml

# Make the CI job wait for the quality gate and fail if it does not pass
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
