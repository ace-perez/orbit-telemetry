# Continuous integration: lint and test every pull request and every push to main.
# The job names "lint" and "test" are what the branch ruleset requires before a merge,
# so renaming a job means updating .github/rulesets/protect-main.json too.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab or `gh workflow run`

# Least privilege: the built-in GITHUB_TOKEN can only read the repo in this workflow.
permissions:
  contents: read

# A new push to the same PR cancels the older run. Runs on main are never cancelled,
# so every commit on main keeps a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to a full commit SHA (the comment shows the version) so a
      # moved or compromised tag cannot change what runs. Dependabot updates both.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # do not leave the token in .git/config

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-python: true # reuse the Python interpreter uv downloads

      - name: Install dependencies exactly as locked
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-python: true

      - name: Install dependencies exactly as locked
        run: uv sync --locked

      - name: Unit and API tests with coverage gate (80%)
        run: >-
          uv run pytest
          --cov
          --cov-report=term
          --cov-report=xml
          --junitxml=reports/junit.xml

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Test coverage"
            echo '```'
            uv run coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            coverage.xml
            reports/junit.xml
          retention-days: 14
          if-no-files-found: warn
