# Continuous integration and delivery: quality and security gates on every pull request and
# every push to main; for every green commit on main, an arm64 image published to GHCR and
# deployed to k3s on AWS Graviton (Phase 6).
# Every gate job name (lint, test, sast, trivy, secrets, sonarqube, container, helm) is a required
# check in .github/rulesets/protect-main.json, so renaming a job means updating that file too.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"] # release tags (Phase 8) publish a versioned image
  workflow_dispatch: # allows a manual run from the Actions tab or `gh workflow run`

# Least privilege: the built-in GITHUB_TOKEN can only read the repo in this workflow.
permissions:
  contents: read

# A new push to the same PR cancels the older run. Runs on main are never cancelled,
# so every commit on main keeps a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Shared by the trivy and container jobs. Trivy is installed from the release binary with a
# pinned checksum instead of aquasecurity/trivy-action, whose tags were hijacked in March 2026.
env:
  TRIVY_VERSION: "0.76.2"
  TRIVY_PLATFORM: Linux-64bit # x86_64 runners; the arm64 jobs override both values
  TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to a full commit SHA (the comment shows the version) so a
      # moved or compromised tag cannot change what runs. Dependabot updates both.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # do not leave the token in .git/config

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-python: true # reuse the Python interpreter uv downloads

      - name: Install dependencies exactly as locked
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false # plain terraform output in the logs

      - name: Terraform format and validate (no backend, no AWS access)
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive -diff
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-python: true

      - name: Install dependencies exactly as locked
        run: uv sync --locked

      - name: Unit and API tests with coverage gate (80%)
        run: >-
          uv run pytest
          --cov
          --cov-report=term
          --cov-report=xml
          --junitxml=reports/junit.xml

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Test coverage"
            echo '```'
            uv run coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            coverage.xml
            reports/junit.xml
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Phase 3: static analysis and security scanning
  # ---------------------------------------------------------------------------

  sast:
    name: sast
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload SARIF results to the repo's Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-python: true

      - name: Install dependencies exactly as locked
        run: uv sync --locked

      - name: Bandit SAST (fails on medium or high severity)
        run: uv run bandit -r src -ll -f sarif -o bandit.sarif

      - name: Show Bandit findings in the log
        if: failure()
        run: uv run bandit -r src -ll

      - name: Upload Bandit results to code scanning
        if: always() && hashFiles('bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: bandit.sarif
          category: bandit

  trivy:
    name: trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy (pinned version, checksum verified)
        run: |
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_${TRIVY_PLATFORM}.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check -
          tar -xzf trivy.tar.gz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          rm trivy trivy.tar.gz
          trivy --version

      - name: Dependency vulnerabilities (fails on fixable HIGH or CRITICAL)
        run: >-
          trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
          --exit-code 1 --skip-dirs .venv --no-progress .

      - name: IaC and Dockerfile misconfigurations (fails on HIGH or CRITICAL)
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 --skip-dirs .venv .

      - name: Full report for the Security tab
        if: always()
        run: >-
          trivy fs --scanners vuln,misconfig --ignore-unfixed --format sarif
          --output trivy.sarif --skip-dirs .venv --no-progress .

      - name: Upload Trivy results to code scanning
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy.sarif
          category: trivy

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret deleted later is still in old commits
          persist-credentials: false

      - name: Install Gitleaks (pinned version, checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz

      - name: Scan the whole git history for secrets
        run: >-
          gitleaks git . --redact --exit-code 1
          --report-format sarif --report-path gitleaks.sarif

      - name: Upload Gitleaks results to code scanning
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  sonarqube:
    name: sonarqube
    needs: test # reuses the coverage report the test job uploaded
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SonarQube uses git history to tell new code from old
          persist-credentials: false

      - name: Download the test job's coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-reports

      - name: SonarQube Cloud analysis and quality gate
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------------------------------------------------------------------------
  # Phase 4: container image
  # ---------------------------------------------------------------------------

  # Phase 6: the image jobs run on arm64 runners, so the image that is built, scanned and
  # tested is the same architecture as the Graviton node that runs it.
  container:
    name: container
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      HADOLINT_VERSION: "2.15.1"
      # Hadolint publishes no checksum file for this release, so this is the SHA-256 of the
      # binary as first downloaded (trust on first use): any later change to it fails the job.
      HADOLINT_SHA256: "f6198ef8090f404dbb771abfee086eb8c48ac177f30da7fd3510aca35b344b5d"
      TRIVY_PLATFORM: Linux-ARM64
      TRIVY_SHA256: "ab9d51f86e6a5fb936f605faff6b593ac51bc378fff4d3e8b9d58358b9c367c3"
      CI_IMAGE: orbit-telemetry:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Hadolint (pinned version, checksum verified)
        run: |
          curl -sSfL -o hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-arm64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum --check -
          sudo install -m 0755 hadolint /usr/local/bin/hadolint
          rm hadolint

      - name: Lint the Dockerfile (fails on warnings)
        run: hadolint Dockerfile

      - name: Hadolint report for the Security tab
        if: always()
        run: hadolint --no-fail --format sarif Dockerfile > hadolint.sarif

      - name: Upload Hadolint results to code scanning
        if: always() && hashFiles('hadolint.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: hadolint.sarif
          category: hadolint

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true # into the runner's Docker, so Trivy and Compose can use it
          tags: ${{ env.CI_IMAGE }}
          build-args: APP_VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max # layer cache shared with the publish job

      - name: Image size
        run: docker image ls "${CI_IMAGE}" --format '{{.Repository}}:{{.Tag}} {{.Size}}' >> "$GITHUB_STEP_SUMMARY"

      - name: Install Trivy (pinned version, checksum verified)
        run: |
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_${TRIVY_PLATFORM}.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check -
          tar -xzf trivy.tar.gz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          rm trivy trivy.tar.gz

      - name: Image vulnerabilities, OS and Python packages (fails on fixable HIGH or CRITICAL)
        run: >-
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
          --exit-code 1 --no-progress "${CI_IMAGE}"

      # Only vulnerabilities that have a fix: the Security tab should list things we can act
      # on. Unfixed base-image CVEs (no patch from Debian yet) would bury them in noise.
      - name: Image report for the Security tab
        if: always()
        run: >-
          trivy image --scanners vuln --ignore-unfixed --format sarif
          --output trivy-image.sarif --no-progress "${CI_IMAGE}"

      - name: Upload image scan results to code scanning
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-python: true

      - name: Install test dependencies exactly as locked
        run: uv sync --locked

      - name: Start the stack (stub, app, Prometheus) and wait until healthy
        env:
          APP_IMAGE: ${{ env.CI_IMAGE }}
        run: docker compose up --detach --no-build --wait --wait-timeout 120

      - name: Integration tests against the running containers
        env:
          INTEGRATION_BASE_URL: http://localhost:8000
          INTEGRATION_PROMETHEUS_URL: http://localhost:9090
        run: uv run pytest tests/integration -v --junitxml=reports/integration.xml

      - name: Container logs (on failure)
        if: failure()
        env:
          APP_IMAGE: ${{ env.CI_IMAGE }}
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        env:
          APP_IMAGE: ${{ env.CI_IMAGE }}
        run: docker compose down --volumes

  # ---------------------------------------------------------------------------
  # Phase 5: Helm chart, validated statically and installed into a throwaway cluster
  # ---------------------------------------------------------------------------

  helm:
    name: helm
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      HELM_VERSION: "4.3.2"
      # Taken from get.helm.sh's published .sha256sum for linux-arm64 (Phase 6, Step 1).
      HELM_SHA256: "df31cb61680ef728f82c770e5280dd565617bee6b039d37e85c677288be4bbb0"
      KIND_VERSION: "0.33.0"
      KIND_SHA256: "20022bee6cfcd5086cb7234d218e3454e6090022f2a8f55d1fa7fcf42c3867a2"
      KUBECONFORM_VERSION: "0.8.0"
      KUBECONFORM_SHA256: "1f53fc8e81258197a35e8603054162a5af1de8c5af13746c71ab680d9534ed87"
      CHART: charts/orbit-telemetry
      CI_IMAGE: orbit-telemetry:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm, kind and kubeconform (pinned versions, checksums verified)
        run: |
          curl -sSfL -o helm.tar.gz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-arm64.tar.gz"
          echo "${HELM_SHA256}  helm.tar.gz" | sha256sum --check -
          tar -xzf helm.tar.gz --strip-components=1 linux-arm64/helm
          sudo install -m 0755 helm /usr/local/bin/helm

          curl -sSfL -o kind "https://github.com/kubernetes-sigs/kind/releases/download/v${KIND_VERSION}/kind-linux-arm64"
          echo "${KIND_SHA256}  kind" | sha256sum --check -
          sudo install -m 0755 kind /usr/local/bin/kind

          curl -sSfL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-arm64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum --check -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

          rm -f helm helm.tar.gz kind kubeconform kubeconform.tar.gz
          helm version --short && kind version && kubeconform -v

      - name: Lint the chart (default, kind and every optional template)
        run: |
          helm lint --strict "${CHART}"
          helm lint --strict "${CHART}" -f deploy/kind/values-kind.yaml
          helm lint --strict "${CHART}" -f "${CHART}/ci/full-values.yaml"

      - name: Validate rendered manifests against Kubernetes 1.37 schemas
        run: |
          helm template orbit-telemetry "${CHART}" -f "${CHART}/ci/full-values.yaml" \
            | kubeconform -strict -summary -kubernetes-version 1.37.0 \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          kubeconform -strict -summary -kubernetes-version 1.37.0 deploy/kind/celestrak-stub.yaml

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-python: true

      - name: Check the alert and SLO rules with promtool
        env:
          PROMETHEUS_VERSION: "3.16.0"
          PROMETHEUS_SHA256: "fd8571b8162f4020232d886f17340bcf92e1722985ae3b4c1d096157826c0fbe"
        run: |
          curl -sSfL -o prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-arm64.tar.gz"
          echo "${PROMETHEUS_SHA256}  prometheus.tar.gz" | sha256sum --check -
          tar -xzf prometheus.tar.gz --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-arm64/promtool"
          helm template orbit-telemetry "${CHART}" -f deploy/ec2/values-ec2.yaml \
            --set image.tag=sha-0000000 --show-only templates/prometheusrule.yaml \
            | uv run --no-project --with pyyaml python -c 'import json, sys, yaml; d = yaml.safe_load(sys.stdin); json.dump({"groups": d["spec"]["groups"]}, sys.stdout)' \
            > rules.json
          ./promtool check rules rules.json
          rm -f prometheus.tar.gz promtool rules.json

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image (reuses the container job's layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.CI_IMAGE }}
          build-args: APP_VERSION=ci-${{ github.sha }}
          cache-from: type=gha

      - name: Create a kind cluster and load the image
        run: |
          kind create cluster --name ci --wait 120s
          kind load docker-image "${CI_IMAGE}" --name ci
          kubectl get nodes -o wide

      - name: Deploy the CelesTrak stub
        run: |
          kubectl create configmap celestrak-stub \
            --from-file=tools/celestrak_stub.py --from-file=tests/fixtures/omm.json
          kubectl apply -f deploy/kind/celestrak-stub.yaml
          kubectl rollout status deployment/celestrak-stub --timeout=120s

      - name: Install the chart and wait until it is ready
        run: >-
          helm install orbit-telemetry "${CHART}"
          -f deploy/kind/values-kind.yaml
          --wait --timeout 3m

      - name: Helm test (readiness through the Service)
        run: helm test orbit-telemetry --logs

      - name: Integration tests through the Kubernetes Service
        env:
          INTEGRATION_BASE_URL: http://localhost:8000
          INTEGRATION_EXPECTED_ENVIRONMENT: kind
        run: |
          uv sync --locked
          # Forward a local port to the Service in the background; the tests retry until ready.
          kubectl port-forward service/orbit-telemetry 8000:80 > port-forward.log 2>&1 &
          uv run pytest tests/integration -v

      - name: Cluster state (on failure)
        if: failure()
        run: |
          kubectl get all -o wide
          kubectl describe pods
          kubectl logs deployment/orbit-telemetry --tail=100 || true
          kubectl get events --sort-by=.lastTimestamp | tail -30

      - name: Delete the cluster
        if: always()
        run: kind delete cluster --name ci

  # Publishes only from main or a release tag, and only after every gate passed. On a PR this
  # job is skipped, so it is deliberately not a required check.
  publish:
    name: publish
    if: github.event_name == 'push'
    needs: [lint, test, sast, trivy, secrets, sonarqube, container, helm]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry with the built-in token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha-1a2b3c4 on every publish (immutable, what Phase 6 deploys), main on the default
      # branch, and 1.0.0 / 1.0 on a v1.0.0 tag.
      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push (layers reused from the container job's cache)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64 # the Graviton node; built natively, no emulation
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          provenance: mode=max # unsigned SLSA record of how and where the image was built
          sbom: true # software bill of materials attached to the image

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Published image"
            echo '```'
            echo "${TAGS}"
            echo "digest: ${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Phase 6: continuous deployment to k3s on AWS Graviton
  # ---------------------------------------------------------------------------

  # Runs after every successful publish from main. No AWS keys are stored in GitHub: the job
  # trades its short-lived OIDC token for a role that can only run a command on one instance,
  # and only for this repository's "production" environment. Switched off until the
  # infrastructure exists, and again after `terraform destroy` (variable DEPLOY_ENABLED).
  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: http://${{ vars.APP_HOST }}/docs
    concurrency:
      group: deploy-production
      cancel-in-progress: false # never stop a deploy halfway; queue the next one
    permissions:
      contents: read
      id-token: write # request the OIDC token that AWS exchanges for the deploy role
    env:
      AWS_REGION: eu-west-1
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      APP_HOST: ${{ vars.APP_HOST }}
    steps:
      - name: Get temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy this commit with Helm, through SSM Run Command
        run: |
          set -euo pipefail
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          PARAMS="$(jq -cn --arg c "/opt/orbit/deploy.sh ${GITHUB_SHA} ${IMAGE_TAG}" '{commands: [$c]}')"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${IMAGE_TAG} (run ${GITHUB_RUN_ID})" \
            --timeout-seconds 900 \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)"
          echo "SSM command ${COMMAND_ID}"

          STATUS=Pending
          for _ in $(seq 1 180); do # up to 15 minutes: rollout, helm test, 150 s bake
            STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done

          echo "::group::Output from the node"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "::endgroup::"
          echo "::group::Errors from the node"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          echo "::endgroup::"

          echo "Deploy finished with status: ${STATUS}"
          [ "$STATUS" = "Success" ]

      - name: Smoke test from outside (the live version must be this commit)
        run: |
          set -euo pipefail
          LIVE=""
          for _ in $(seq 1 24); do
            LIVE="$(curl -fsS --max-time 5 "http://${APP_HOST}/api/v1/info" | jq -r .version || true)"
            [ "$LIVE" = "$IMAGE_TAG" ] && break
            sleep 5
          done
          echo "Expected ${IMAGE_TAG}, live ${LIVE:-nothing}"
          [ "$LIVE" = "$IMAGE_TAG" ]
          {
            echo "## Deployed"
            echo "- Version: \`${IMAGE_TAG}\`"
            echo "- URL: http://${APP_HOST}/docs"
          } >> "$GITHUB_STEP_SUMMARY"
