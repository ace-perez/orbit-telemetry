# Dependabot opens PRs when dependencies have updates.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  # Base images in the Dockerfile (python, uv). Python stays on 3.13 until a deliberate
  # upgrade: only patch updates (3.13.x) are proposed automatically.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      base-images:
        patterns: ["*"]

  # Images in compose.yaml (python for the stub, prometheus), same Python rule.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      compose-images:
        patterns: ["*"]

  # Terraform providers (infra/terraform/.terraform.lock.hcl)
  - package-ecosystem: "terraform"
    directory: "/infra/terraform"
    schedule:
      interval: "weekly"
